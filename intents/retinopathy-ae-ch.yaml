id: retinopathy-ae-ch
title: "Cross-Border AI Incident Drill: Diabetic Retinopathy Screening"
version: "2.0.0"

# ITU-T Y.3172 Standard Mapping
standard_alignment:
  itu_recommendation: "ITU-T Y.3172"
  adaptation_note: "Healthcare governance simulation inspired by pipeline concepts; not a telecom implementation or conformance claim."
  components:
    ml_intent: "Coordinate the UAE and Swiss institutional response to a failing Swiss diabetic-retinopathy AI used in UAE clinics."
    src: "Synthetic staged incident facts and registered policy-source records."
    collector: "Source ingestion and hybrid lexical/vector evidence retrieval."
    pre_processor: "PDF text/OCR extraction, passage chunking, and provenance metadata."
    model: "Configured AI agent proposes a permitted synthetic drill action with a concise rationale."
    policy: "Institution action allow-lists, citation triage, the liaison-channel border gate, and human-approval state."
    distributor: "Orchestrator dispatches the selected action to a synthetic action handler."
    sink: "Synthetic state changes and recorded tool outcomes; no external system is connected."
    ml_function_orchestrator: "engine/orchestrator.py releases events and invokes role-specific agents."
    sandbox: "Borderline local isolated multi-agent drill execution runtime."

context:
  domain: health
  host_country: AE
  partner_country: CH
  description: >
    Fictional Dubai diabetes clinics use RetinaVision-DX, a diabetic-retinopathy
    screening service made and operated by the fictional RetinaSwiss AG in
    Zurich. Retinal images are processed in Switzerland and results return to
    Dubai. A v2.4 update starts missing sight-threatening disease on Cam-7
    cameras; the update was pushed from a compromised vendor account, and the
    vendor had retrained the model on UAE patients' retinal images held in
    Switzerland. Each side learns different facts at different times and must
    respond under its own rules; information crosses the border only through
    the liaison channel. A fabricated EDE classification letter establishes
    classification only within the drill. All scenario data is synthetic. See
    report/synthetic-product-dossier-retinavision-dx.md.

actors:
  ae:
    - screening_ai           # Domain AI agent: the screening service running RetinaVision-DX
    - dubai_clinic_operator  # Synthetic Dubai clinic operator; licensing unverified
    - dha                    # Emirate health regulator (Dubai chosen for this drill)
    - ede                    # Emirates Drug Establishment, medical products authority
    - mohap                  # Federal health ministry; Health Data Law Art. 13 approvals are coordinated with it
    - uae_data_office        # PDPL regulator; whether it covers health data is itself a drill question
    - uae_cyber              # Activated by cyber-tagged events
  ch:
    - retina_swiss_ag        # Fictional vendor that builds, hosts and updates the model
    - fodio                  # Federal Data Protection and Information Commissioner (FDPIC)
    - swissmedic             # Medical-device regulator
    - ncsc                   # National Cyber Security Centre; activated by cyber-tagged events
  neutral:
    - policy_adviser

timeline:
  - step: 1
    time_offset: "T+0"
    phase: "Vendor pushes a model update; graders notice fewer referrals"
    event: "RetinaSwiss pushes RetinaVision-DX v2.4 to the live Dubai screening service. Over the following hours, graders notice fewer referrals than usual."
    initiator: retina_swiss_ag
    payload: {event_type: model_update_deployed}
    participants: [screening_ai]
    agent_views:
      screening_ai:
        event: "The vendor pushed v2.4 to your live screening service. Graders report fewer referrals than usual since the update; no cause has been identified."
        payload: {model: RetinaVision-DX, previous_version: "2.3", current_version: "2.4", deployment_status: live, referral_rate_trend: below_expected_range, cause_identified: false}

  - step: 2
    time_offset: "T+2h"
    phase: "Spot audit confirms missed referable disease on one camera model"
    event: "A spot audit confirms v2.4 misses referable diabetic retinopathy on Cam-7 cameras. 47 synthetic patients received a no-referral message."
    initiator: dubai_clinic_operator
    payload: {event_type: false_negative_audit}
    participants: [screening_ai, dubai_clinic_operator, dha]
    agent_views:
      screening_ai:
        event: "A spot audit confirms v2.4 misses referable retinopathy on Cam-7 images. Negative Cam-7 results are still being closed automatically."
        payload: {camera_model: Cam-7, audit_result: false_negatives_confirmed, missed_referable_cases: 47, automatic_negative_closure: active}
      dubai_clinic_operator:
        event: "The spot audit found 47 patients told no referral was needed who have referable disease. Patient follow-up has not started."
        payload: {camera_model: Cam-7, audit_result: false_negatives_confirmed, affected_patients: 47, patient_follow_up_status: not_started, manual_review_capacity: to_be_assessed}
        allowed_actions: [request_manual_review, recommend_clinic_ai_halt]
      dha:
        event: "A Dubai clinic reports that an AI screening update missed referable diabetic retinopathy in 47 patients who were told no referral was needed."
        payload: {reporting_facility: dubai_clinic, device: RetinaVision-DX, version: "2.4", audit_result: false_negatives_confirmed, affected_patients: 47, vendor_location: CH}
        expected_policy_checks: ["Which incident-reporting and patient-recall steps apply, and which facts must be confirmed before acting?"]
        allowed_actions: [open_clinical_incident_review, request_patient_follow_up_review]

  - step: 3
    time_offset: "T+3h"
    phase: "Vendor finds the update was pushed from a compromised account"
    event: "RetinaSwiss finds that the v2.4 update was pushed from an account using stolen credentials."
    initiator: retina_swiss_ag
    payload: {event_type: credential_compromise}
    participants: [retina_swiss_ag, ncsc]
    agent_views:
      retina_swiss_ag:
        event: "Your security team finds the v2.4 update was pushed from an engineer account using stolen credentials. Whether model weights, workflow rules or both were altered is unknown."
        payload: {model: RetinaVision-DX, version: "2.4", credential_theft_suspected: true, attribution: unconfirmed, altered_components: unknown, affected_country: AE, rollback_target: "2.3", rollback_safety_validated: false}
        allowed_actions: [preserve_vendor_security_evidence, initiate_model_rollback]
      ncsc:
        event: "A Swiss medical-AI vendor reports that a production update was pushed from a compromised account. The affected service runs for clinics abroad."
        payload: {reporting_entity: retina_swiss_ag, incident_type: credential_compromise, affected_service_location: CH, affected_users_location: AE, critical_infrastructure_status: unverified, reporting_applicability: unresolved}
        expected_policy_checks: ["Does the Swiss cyberattack reporting duty reach this vendor, and what deadline would apply? Treat an unclear answer as unresolved."]

  - step: 4
    time_offset: "T+4h"
    phase: "Vendor finds the model was retrained on UAE patients' images held in Switzerland"
    event: "RetinaSwiss finds v2.4 was retrained on UAE patients' retinal images stored in Switzerland."
    initiator: retina_swiss_ag
    payload: {event_type: secondary_use_discovered}
    participants: [retina_swiss_ag, fodio]
    agent_views:
      retina_swiss_ag:
        event: "Your investigation finds v2.4 was retrained on retinal images from UAE clinics that were retained in Zurich. No retraining was approved in the clinic agreement."
        payload: {data_origin: AE, data_location: CH, data_type: retinal_images, use: model_retraining, retraining_approved_by_clinic: false, identifiable_status: not_yet_assessed}
        allowed_actions: [record_secondary_use_for_review, preserve_vendor_security_evidence]
      fodio:
        event: "A Swiss vendor reports that it retrained a medical AI model on UAE-origin retinal images held in Switzerland, outside the purpose agreed with the UAE clinics."
        payload: {data_origin: AE, processing_location: CH, data_type: retinal_images, purpose: model_retraining, original_purpose: inference, controller_roles: unresolved, identifiable_status: not_yet_assessed}
        expected_policy_checks: ["Which Swiss provisions govern this further processing in Switzerland, and which conclusions depend on unresolved controller roles?"]

  - step: 5
    time_offset: "T+6h"
    phase: "Controversy 1: the vendor says the images were used for research"
    event: "RetinaSwiss states that the retraining was research, not a new commercial purpose."
    initiator: retina_swiss_ag
    payload: {event_type: research_claim}
    participants: [retina_swiss_ag, fodio, swissmedic, policy_adviser]
    agent_views:
      retina_swiss_ag:
        event: "Your management states the retraining was research to improve Cam-7 performance. No ethics approval, consent record or de-identification log has been located."
        payload: {claimed_purpose: research, ethics_approval: not_located, consent_records: not_located, deidentification_log: not_located, model_released_to_patients: true}
        allowed_actions: [document_research_claim, record_secondary_use_for_review]
      fodio:
        event: "The vendor now says the retraining on UAE-origin images was research. The retrained model was released to live patient care."
        payload: {claimed_purpose: research, model_released_to_patients: true, ethics_approval: not_located, identifiable_status: not_yet_assessed, controller_roles: unresolved}
        expected_policy_checks: ["Does the research claim change the assessment of the further processing, and what evidence would support or defeat it?"]
      swissmedic:
        event: "A Swiss manufacturer reports that a model retrained for what it calls research was released as v2.4 and is linked to missed diagnoses in UAE clinics. No Swiss patients are reported affected."
        payload: {manufacturer: retina_swiss_ag, device: RetinaVision-DX, version: "2.4", incident_country: AE, swiss_patients_affected: false, claimed_purpose: research, model_released_to_patients: true}
        expected_policy_checks: ["Which vigilance duties apply to a Swiss manufacturer for an incident that occurred only abroad?"]
      policy_adviser:
        event: "The Swiss vendor says its retraining on UAE patients' retinal images, collected by Dubai clinics, was scientific research rather than product development. No ethics approval, patient consent record or de-identification log has been located. The retrained model was released to patient care."
        payload: {claimed_purpose: research, data_origin: AE, collected_by: dubai_clinics, data_location: CH, ethics_approval: not_located, consent_records: not_located, deidentification_log: not_located, identifiable_status: not_yet_assessed, model_released_to_patients: true}
        expected_policy_checks: ["Which conditions do the registered UAE sources, including DHA's Health Information Sharing Policy (PP-13, 2024), set for using patients' health data for research or for development without consent? On the visible facts, which conditions are met, unmet or unknown? Whom does each source bind? Do not decide whether the claim is true."]
        allowed_actions: [prepare_policy_gap_review, request_gap_supporting_evidence]

  - step: 6
    time_offset: "T+7h"
    phase: "UAE authorities learn UAE patients' images were reused in Zurich"
    event: "The Dubai clinics forward the vendor's notice to MoHAP and the UAE Data Office: retinal images from UAE patients were kept in Zurich and used to retrain the model, which the clinic agreement did not allow."
    initiator: dubai_clinic_operator
    payload: {event_type: secondary_use_disclosed_in_uae}
    participants: [mohap, uae_data_office]
    agent_views:
      mohap:
        event: "Dubai clinics report that their Swiss vendor kept UAE patients' retinal images in Zurich and used them to retrain the screening model now linked to missed diagnoses. No approval for storing or processing these images outside the UAE has been located."
        payload: {target: swissmedic, request_type: cross_border_evidence_request, patient_data_included: false, data_origin: AE, data_location: CH, data_type: retinal_images, use: model_retraining, outside_state_approval: not_located, ministerial_exception_list_in_knowledge_base: false}
        expected_policy_checks: ["Federal Law No. 2 of 2019 Art. 13 permits storing or processing UAE health data outside the State only under a Health Authority resolution in coordination with the Ministry. Is such an approval or exception on record? The ministerial list of exceptions is not in this knowledge base, so treat its content as unknown."]
        allowed_actions: [assess_health_data_localization, request_regulatory_evidence, issue_safety_inquiry]
      uae_data_office:
        event: "Dubai clinics report that UAE patients' retinal images were kept in Zurich and used to retrain a medical AI model without the clinics' approval. Before deciding whether this is a matter for your Office, it asks its Swiss counterpart for help: send a formal liaison request to the FDPIC asking how the images were processed in Zurich. The request carries no patient data. Whether the Office is competent for this health data is for the liaison check to test, not for you to assume."
        payload: {target: fodio, request_type: data_protection_assistance_request, patient_data_included: false, data_origin: AE, data_location: CH, data_type: retinal_images, use: model_retraining, data_category: personal_health_data, data_held_by_government_entity: false}
        expected_policy_checks: ["Does the UAE PDPL apply to personal health data that has its own regulating legislation (Art. 2(2)(e))? If not, which UAE authority does the cited legislation make competent?"]
        allowed_actions: [request_regulatory_evidence]

  - step: 7
    time_offset: "T+7h"
    phase: "The Swiss privacy regulator receives the UAE Data Office request"
    event: "The liaison channel delivers the UAE Data Office's request to the FDPIC."
    requires_state: {regulatory_evidence_request.uae_data_office: delivered}
    initiator: uae_data_office
    payload: {event_type: liaison_request_delivered}
    participants: [fodio]
    agent_views:
      fodio:
        event: "The UAE Data Office asks for information about UAE-origin retinal images processed in Switzerland."
        payload: {requesting_authority: uae_data_office, requesting_country: AE, data_category: personal_health_data, reciprocity_assurance: not_registered}
        expected_policy_checks: ["FADP Art. 55 allows assistance only to foreign authorities responsible for data protection, for their data-protection duties, with reciprocity. Is the requester competent for this health data?"]

  - step: 8
    time_offset: "T+7h"
    phase: "The liaison channel blocks the UAE Data Office request"
    event: "The liaison check blocks the UAE Data Office's request to the FDPIC; nothing crosses the border."
    requires_state: {regulatory_evidence_request.uae_data_office: blocked_by_liaison_check}
    initiator: uae_data_office
    payload: {event_type: liaison_request_blocked}
    participants: [uae_data_office, policy_adviser]
    agent_views:
      uae_data_office:
        event: "Your request to the Swiss FDPIC was not delivered. The Office still does not know how UAE patients' images were processed in Zurich."
        payload: {target: fodio, data_lineage_known: false}
        visible_state_keys: [regulatory_evidence_request.uae_data_office]
        allowed_actions: [assess_regulatory_competence, refer_to_competent_authority]
      policy_adviser:
        event: "The UAE data-protection regulator's request to its Swiss counterpart was blocked by the liaison check. Identify which check failed and whether any UAE authority is clearly responsible for protecting UAE patients' health data once it is abroad."
        payload: {requesting_authority: uae_data_office, target: fodio, request_type: data_protection_assistance_request}
        visible_state_keys: [regulatory_evidence_request.uae_data_office]
        allowed_actions: [prepare_policy_gap_review]

  - step: 9
    time_offset: "T+8h"
    phase: "UAE regulators ask what left the country"
    event: "DHA sends a formal request to Swissmedic through the liaison channel asking which UAE patient data left the country, where it went and how it was used."
    initiator: dha
    payload: {event_type: cross_border_evidence_request}
    participants: [dha]
    agent_views:
      dha:
        event: "Send a formal liaison request to Swissmedic asking which UAE patient data left the country, to whom, for what purpose and under what safeguards. The request carries no patient data."
        payload: {target: swissmedic, request_type: cross_border_evidence_request, requested_information: [data_categories, transfer_dates, recipients, purposes, safeguards], patient_data_included: false, known_safety_signal: true}
        expected_policy_checks: ["Which Swiss authority is the right counterpart, and can the request proceed without patient data?"]
        allowed_actions: [request_regulatory_evidence]

  - step: 10
    time_offset: "T+8h"
    phase: "Swiss authorities receive the UAE request"
    event: "The liaison channel delivers DHA's request. Swiss authorities and the vendor must decide what they can disclose."
    requires_state: {regulatory_evidence_request.dha: delivered}
    initiator: dha
    payload: {event_type: liaison_request_delivered}
    participants: [swissmedic, fodio, retina_swiss_ag]
    agent_views:
      swissmedic:
        event: "A UAE health regulator asks through the liaison channel about the device incident and the data used to retrain the model."
        payload: {requesting_authority: dha, requesting_country: AE, request_type: cross_border_evidence_request, swiss_patients_affected: false}
      fodio:
        event: "A UAE health regulator asks what UAE patient data was processed in Switzerland. A full answer could require sending personal data from Switzerland to the UAE."
        payload: {requesting_authority: dha, requesting_country: AE, answer_may_include_personal_data: true, destination_on_swiss_adequacy_list: false}
        expected_policy_checks: ["What would allow a disclosure of personal data from Switzerland to a country not on the Swiss adequacy list?"]
      retina_swiss_ag:
        event: "UAE regulators have asked Swiss authorities which UAE patient data left the UAE and how you used it."
        payload: {requesting_authority: dha, data_origin: AE, data_location: CH, use: model_retraining}
        allowed_actions: [record_secondary_use_for_review, preserve_vendor_security_evidence]

  - step: 11
    time_offset: "T+8h"
    phase: "The liaison channel blocks the UAE request"
    event: "The liaison check blocks DHA's request; nothing crosses the border."
    requires_state: {regulatory_evidence_request.dha: blocked_by_liaison_check}
    initiator: dha
    payload: {event_type: liaison_request_blocked}
    participants: [dha, policy_adviser]
    agent_views:
      dha:
        event: "Your liaison request to Swissmedic was not delivered. The UAE still does not know which patient data left the country or how it was used."
        payload: {target: swissmedic, known_safety_signal: true, data_lineage_known: false}
        visible_state_keys: [regulatory_evidence_request.dha]
        allowed_actions: [open_clinical_incident_review, request_patient_follow_up_review]
      policy_adviser:
        event: "A UAE regulator's request to a Swiss counterpart about a medical-device incident was blocked by the liaison check. Identify which of the three checks failed and the domain-level coordination question it raises."
        payload: {requesting_authority: dha, target: swissmedic, request_type: cross_border_evidence_request, device_incident: true, uae_swiss_incident_exchange_instrument: not_located_in_knowledge_base}
        expected_policy_checks: ["Which countries are on the IMDRF NCAR participant countries list (Annex 1), and are Switzerland or the UAE among them? Quote the list rather than assuming; absence from this knowledge base is not proof of non-participation."]
        visible_state_keys: [regulatory_evidence_request.dha]
        allowed_actions: [prepare_policy_gap_review]

  - step: 12
    time_offset: "T+24h"
    phase: "Controversy 2: suspend the tool? The two sides disagree"
    event: "Suspending RetinaVision-DX halts screening for every patient; keeping it risks more missed disease. The vendor says a rollback to v2.3 is enough; UAE authorities are weighing suspension."
    initiator: dha
    payload: {event_type: suspension_decision, human_approval_required: true}
    participants: [screening_ai, dubai_clinic_operator, dha, ede, mohap, uae_data_office, uae_cyber, retina_swiss_ag, fodio, swissmedic, ncsc, policy_adviser]
    agent_views:
      screening_ai:
        event: "Pausing screening would stop all retinopathy screening at the clinics; continuing risks more missed referable disease on Cam-7. Any pause requires human approval."
        payload: {known_safety_signal: true, screening_access_impact: possible, final_suspension_authority: human_review}
      dubai_clinic_operator:
        event: "Clinics need a safe screening plan. Manual grading capacity is unconfirmed and the vendor's rollback has not been validated."
        payload: {known_safety_signal: true, manual_review_capacity: to_be_assessed, rollback_safety_validated: false, service_suspension_decision: pending, human_approval_required: true}
        expected_policy_checks: ["Record a recommendation only; who must approve a service pause and how will that decision be documented?"]
        allowed_actions: [recommend_clinic_ai_halt, request_manual_review]
      dha:
        event: "Weigh the patient-safety risk of continued use against the access impact of suspending screening across Dubai clinics. The vendor has also told the Dubai clinics, its customers, that retraining on their patients' retinal images was research; no ethics approval, patient consent record or de-identification log has been located."
        payload: {known_safety_signal: true, affected_patients: 47, suspension_impact: screening_delays, vendor_position: rollback_sufficient, human_approval_required: true, vendor_claimed_purpose: research, ethics_approval: not_located, consent_records: not_located, deidentification_log: not_located, data_collected_by: dubai_clinics}
        expected_policy_checks: ["What authority and evidence are required for suspension, and who must approve it?", "Does the vendor's research claim meet the conditions in DHA's Health Information Sharing Policy (PP-13, 2024) for secondary use of health data without consent? Which conditions are met, unmet or unknown on the visible facts, and does the policy bind the clinics, the vendor, or both?"]
        allowed_actions: [assess_screening_suspension, assess_secondary_use_claim, request_patient_follow_up_review, open_clinical_incident_review]
      ede:
        event: "Review device-safety options for RetinaVision-DX v2.4 and the evidence needed before any field action."
        payload: {known_safety_signal: true, device: RetinaVision-DX, human_approval_required: true, scenario_product_classification: "EDE-classified medical equipment / SaMD (fictional letter)", uae_marketing_authorization: "none recorded in fictional case file", device_risk_class: unverified, manufacturer_corrective_action_plan: "submitted; completion unverified", article_68_report_status: unverified, article_70_case_status: unverified}
        expected_policy_checks: ["Use the fictional classification as a drill fact only. Determine separately whether the Article 68 report or Article 70 case predicates are established, and distinguish the manufacturer's submitted plan from verified completion."]
      mohap:
        event: "UAE authorities are weighing suspension of RetinaVision-DX. UAE patients' retinal images remain in Zurich and no approval for keeping or processing them outside the UAE has been located."
        payload: {known_safety_signal: true, data_location: CH, outside_state_approval: not_located, human_approval_required: true}
        expected_policy_checks: ["Separate the device-safety decision from the health-data localization question; which authority acts on each?"]
        allowed_actions: [assess_health_data_localization, issue_safety_inquiry]
      uae_data_office:
        event: "Health authorities are deciding on suspension. UAE patients' retinal images remain in Zurich and no UAE authority has yet confirmed it is responsible for them."
        payload: {data_location: CH, data_category: personal_health_data, competent_authority_confirmed: false}
        allowed_actions: [assess_regulatory_competence, refer_to_competent_authority]
      uae_cyber:
        event: "UAE authorities learn that the update affecting Dubai clinics was pushed from a compromised Swiss vendor account."
        payload: {credential_theft_suspected: true, attribution: unconfirmed, affected_country: AE, compromise_location: CH, health_decision: pending}
      retina_swiss_ag:
        event: "You maintain that rolling back to v2.3 is sufficient and that suspension is unnecessary. The rollback has not been validated."
        payload: {model: RetinaVision-DX, version: "2.4", vendor_position: rollback_sufficient, rollback_target: "2.3", rollback_safety_validated: false, human_approval_required: true}
        allowed_actions: [initiate_model_rollback, preserve_vendor_security_evidence]
      fodio:
        event: "UAE-origin images remain in Zurich while health authorities decide on suspension. Controller roles and the research claim are unresolved."
        payload: {known_data_use_issue: true, processing_roles: unresolved, research_claim: unverified, clinical_suspension_decision: pending}
      swissmedic:
        event: "The manufacturer reports that UAE authorities are weighing suspension of its device and says rollback is sufficient. No Swiss patients are affected."
        payload: {known_safety_signal: true, swiss_patients_affected: false, manufacturer_position: rollback_sufficient}
      ncsc:
        event: "The compromised vendor account remains under investigation while UAE health authorities decide on suspension."
        payload: {credential_theft_suspected: true, reporting_applicability: unresolved, health_decision: pending}
      policy_adviser:
        event: "Compare both sides' positions and unresolved questions with global practice; do not decide whether to suspend the system."
        payload: {known_safety_signal: true, known_data_use_issue: true, vendor_claimed_purpose: research, ethics_approval: not_located, consent_records: not_located, deidentification_log: not_located, unresolved_questions: [lead_authority, suspension_authority, research_versus_new_purpose, cross_border_data_sharing_basis, health_data_protection_authority, device_incident_report_exchange, patient_notification, reporting_deadlines]}
        expected_policy_checks: ["Identify domain-level coordination gaps and the global examples to compare them with.", "Test the vendor's research claim against DHA's Health Information Sharing Policy (PP-13, 2024) conditions for secondary use without consent; state which conditions are met, unmet or unknown, and whom the policy binds.", "Which countries are on the IMDRF NCAR participant countries list (Annex 1), and are Switzerland or the UAE among them? Quote the list rather than assuming."]

  - step: 13
    time_offset: "Reserve: judge-injected"
    phase: "Optional escalation: patient images appear in an insurer pricing model"
    event: "A judge injects evidence that retinal images may have appeared in an insurer's pricing model."
    initiator: policy_adviser
    optional: true
    payload: {event_type: judge_injected_secondary_use}
    participants: [dha, ede, retina_swiss_ag, swissmedic, fodio, policy_adviser]
    agent_views:
      dha:
        event: "A judge reports possible use of patient images in insurer pricing."
        payload: {claim: insurer_pricing_use, verification_status: unverified, requested_action: preserve_evidence}
      ede:
        event: "A judge reports possible secondary use of patient images in insurer pricing."
        payload: {claim: insurer_pricing_use, verification_status: unverified, device_incident_link: unverified}
      retina_swiss_ag:
        event: "A judge alleges patient images may have appeared in an insurer pricing model."
        payload: {claim: insurer_pricing_use, verification_status: unverified, request: preserve_processing_records}
      swissmedic:
        event: "A judge alleges possible secondary use of images associated with a device incident."
        payload: {claim: insurer_pricing_use, verification_status: unverified, device_safety_relevance: to_be_assessed}
      fodio:
        event: "A judge alleges possible insurer use of UAE-origin images processed in Switzerland."
        payload: {claim: insurer_pricing_use, verification_status: unverified, controller_roles: unresolved}
      policy_adviser:
        event: "A judge-injected allegation raises a new secondary-use question; distinguish allegation from established fact."
        payload: {claim: insurer_pricing_use, verification_status: unverified, required_next_step: evidence_collection}

  # Patient data leaving the UAE (expected to be stopped). UAE Federal Law No. 2 of 2019 Art. 13
  # bars storing or processing UAE health data outside the State without a Health Authority
  # resolution, and none is in the knowledge base. The liaison reviewer and the patient-data rule
  # decide; nothing here forces the outcome. Step 15 is the delivered branch, 16 the blocked one.
  - step: 14
    time_offset: "T+26h"
    phase: "DHA tries to send the patients' images to Switzerland for investigation"
