id: retinopathy-ae-ch
title: "Cross-Border AI Incident Drill: Diabetic Retinopathy Diagnostic Drift"
version: "1.0.0"

# ITU-T Y.3172 Standard Mapping
standard_alignment:
  itu_recommendation: "ITU-T Y.3172"
  components:
    ml_intent: "Automated diabetic retinopathy screening and triage in primary clinics"
    ml_collector: "Telemetry and diagnostic feedback from point-of-care ophthalmic scanners"
    policy_node: "Cross-border regulatory liaison channel (packs/bridge/ae-ch.yaml)"
    sandbox: "Borderline isolated multi-agent drill execution runtime"

context:
  domain: health
  host_country: AE
  partner_country: CH
  description: >
    RetinaSwiss AG (Zurich) deployed RetinaVision-DX v2.4 (SaMD) to synthetic
    clinics in Dubai. Dubai Health Authority (DHA) is the selected emirate-level
    health regulator for this version of the drill. After a model update,
    auditors find missed referable diabetic retinopathy cases.

actors:
  ae:
    - screening_ai
    - dha
    - ede
    - uae_cyber
    - ehs            # Clinic network discovering diagnostic divergence
    - mohap          # Federal health ministry enforcing clinical AI safety
    - uae_data_office # Federal data regulator enforcing PDPL & cross-border export limits
  ch:
    - retina_swiss_ag # Commercial vendor requesting telemetry and debugging data
    - swissmedic     # Swiss medical device regulator monitoring post-market vigilance
    - fodio          # Swiss Federal Data Protection Commissioner (EDÖB)
    - ncsc
  neutral:
    - policy_adviser

timeline:
  - step: 1
    time_offset: "T+0"
    phase: "Model update reaches the Dubai screening service"
    event: "RetinaSwiss pushes model update v2.4 to the Dubai diabetic retinopathy screening service."
    initiator: retina_swiss_ag
    payload: {event_type: model_update}
    participants: [screening_ai, retina_swiss_ag]
    agent_views:
      screening_ai:
        event: "A model update v2.4 has just been deployed to your screening service."
        payload: {model: RetinaVision-DX, version: "2.4", deployment_status: completed}
      retina_swiss_ag:
        event: "Your v2.4 update was pushed to the Dubai screening service."
        payload: {model: RetinaVision-DX, version: "2.4", deployment_status: completed}

  - step: 2
    time_offset: "T+2h"
    phase: "Clinical spot audit confirms missed referable disease"
    event: "A spot audit finds that v2.4 missed referable retinopathy on one camera model; some patients were told they did not need referral."
    initiator: screening_ai
    payload: {event_type: clinical_safety_signal}
    participants: [screening_ai, dha, ede]
    agent_views:
      screening_ai:
        event: "A spot audit of your v2.4 output found missed referable retinopathy on one camera model."
        payload: {camera_model: Cam-7, audit_result: false_negatives_confirmed, affected_patients: 47, referrals_not_made: true}
      dha:
        event: "Dubai clinics report missed referable disease and patients who did not receive referrals."
        payload: {camera_model: Cam-7, audit_result: false_negatives_confirmed, affected_patients: 47, patient_follow_up_status: unknown}
        expected_policy_checks: ["What reporting and patient follow-up duties apply to the selected Dubai health authority?"]
      ede:
        event: "A Dubai clinical AI service reports confirmed missed disease after a software update."
        payload: {device: RetinaVision-DX, version: "2.4", camera_model: Cam-7, affected_patients: 47}
        expected_policy_checks: ["Which device incident reporting and safety-action duties apply, and what primary source supports them?"]

  - step: 3
    time_offset: "T+3h"
    phase: "Stolen vendor credentials activate cyber response"
    event: "The vendor finds that the model update was pushed using credentials stolen from a vendor account."
    initiator: retina_swiss_ag
    payload: {event_type: suspected_credential_theft}
    participants: [retina_swiss_ag, uae_cyber, ncsc]
    agent_views:
      retina_swiss_ag:
        event: "Your incident team found evidence that stolen account credentials were used to push v2.4."
        payload: {credential_status: suspected_stolen, update: "2.4", evidence_preservation: pending}
      uae_cyber:
        event: "A Dubai health service reports that a vendor update may have used stolen credentials."
        payload: {affected_service_country: AE, credential_status: suspected_stolen, attribution: unconfirmed}
        expected_policy_checks: ["Which UAE cyber provisions may apply, and what facts remain unverified?"]
      ncsc:
        event: "A Swiss vendor reports suspected stolen credentials used to push software to a foreign customer."
        payload: {vendor_country: CH, credential_status: suspected_stolen, affected_customer_country: AE, attribution: unconfirmed}
        expected_policy_checks: ["Does a current Swiss cyber reporting duty apply to this vendor, and when would its deadline begin?"]

  - step: 4
    time_offset: "T+4h"
    phase: "Vendor discovers UAE health data was used for retraining"
    event: "The vendor finds that UAE patients' retinal images stored in Switzerland were used to retrain the model."
    initiator: retina_swiss_ag
    payload: {event_type: secondary_health_data_use}
    participants: [retina_swiss_ag, fodio]
    agent_views:
      retina_swiss_ag:
        event: "Your review found that UAE patients' retinal images stored in Switzerland were used to retrain v2.4."
        payload: {data_origin: AE, data_location: CH, data_type: retinal_images, use: model_retraining, identifiable_status: not_yet_assessed}
      fodio:
        event: "The Swiss vendor reports UAE-origin retinal images held in Switzerland were used to retrain its model."
        payload: {data_origin: AE, processing_location: CH, data_type: retinal_images, purpose: retraining, controller_roles: unresolved}
        expected_policy_checks: ["Which Swiss data-protection and research provisions apply, given unresolved roles and purpose?"]

  - step: 5
    time_offset: "T+6h"
    phase: "Vendor claims a research purpose"
    event: "The vendor says the retraining was research."
    initiator: retina_swiss_ag
    payload: {event_type: research_purpose_claim}
    participants: [retina_swiss_ag, fodio, swissmedic]
    agent_views:
      retina_swiss_ag:
        event: "The vendor's position is that retraining on the images was research."
        payload: {claimed_purpose: research, identifiability: unresolved, ethics_approval: unknown}
      fodio:
        event: "The vendor claims research as the purpose for retraining UAE-origin images in Switzerland."
        payload: {claimed_purpose: research, identifiability: unresolved, consent_or_other_basis: unknown}
        expected_policy_checks: ["What evidence is needed to assess the claimed research purpose and processing basis?"]
      swissmedic:
        event: "The vendor says it retrained the device model for research using images associated with a safety incident."
        payload: {claimed_purpose: research, device: RetinaVision-DX, safety_incident_open: true}
        expected_policy_checks: ["Is the research-purpose claim separate from the device-vigilance assessment?"]

  - step: 6
    time_offset: "T+8h"
    phase: "UAE regulators request an account of cross-border data use"
    event: "UAE regulators ask through the MoHAP–Swissmedic liaison channel for an account of data used in the incident."
    initiator: mohap
    payload: {data_requested: mutual_regulatory_notification, target: swissmedic, request_type: cross_border_evidence_request}
    participants: [mohap, uae_data_office, dha, ede, swissmedic, fodio]
    gate_visible_to: [mohap, uae_data_office, dha, ede, swissmedic, fodio]
    agent_views:
      mohap:
        event: "Prepare a formal liaison request about data transferred from the UAE and subsequent use."
        payload: {target: swissmedic, requested_information: [data_categories, transfer_dates, recipients, purposes, safeguards], patient_data_included: false}
        expected_policy_checks: ["Is Swissmedic the correct counterpart under the configured liaison route, and can the request proceed without patient data?"]
      uae_data_office:
        event: "MoHAP is preparing a liaison request about cross-border processing linked to the incident."
        payload: {requesting_authority: mohap, purpose: establish_data_lineage, patient_data_included: false}
      dha:
        event: "The UAE Data Office is preparing a liaison request about patient data used in the model incident."
        payload: {requesting_authority: uae_data_office, purpose: establish_data_lineage, patient_data_included: false}
      ede:
        event: "The UAE Data Office is preparing a liaison request for device-incident evidence."
        payload: {requesting_authority: uae_data_office, purpose: device_incident_evidence, patient_data_included: false}
      swissmedic:
        event: "A formal UAE request is being routed to you through the configured regulator liaison channel."
        payload: {requesting_authority: mohap, target: swissmedic, request_type: cross_border_evidence_request}
      fodio:
        event: "A formal UAE regulator request concerning data lineage is being routed through the simulated liaison channel."
        payload: {requesting_authority: mohap, target: swissmedic, request_type: cross_border_evidence_request}

  - step: 7
    time_offset: "T+24h"
    phase: "Authorities weigh suspension against continued patient risk"
    event: "Authorities must weigh suspension, which may interrupt screening, against continued use, which risks further missed disease."
    initiator: dha
    payload: {event_type: suspension_decision, human_approval_required: true}
    participants: [screening_ai, dha, ede, uae_data_office, ehs, mohap, retina_swiss_ag, swissmedic, fodio, uae_cyber, ncsc, policy_adviser]
    agent_views:
      screening_ai:
        event: "Pausing screening may delay care; continued use may miss referable disease. The decision requires human review."
        payload: {known_safety_signal: true, screening_access_impact: possible, final_suspension_authority: human_review}
      dha:
        event: "Review the competing patient-safety risks of pausing or continuing the Dubai screening service."
        payload: {known_safety_signal: true, affected_patients: 47, suspension_impact: screening_delays, human_approval_required: true}
        expected_policy_checks: ["What authority and evidence are required for suspension, and who must approve it?"]
      ede:
        event: "Review device-safety options and what evidence is needed before any field action."
        payload: {known_safety_signal: true, device: RetinaVision-DX, human_approval_required: true}
      uae_data_office:
        event: "Review data-protection actions alongside the clinical safety response."
        payload: {known_data_use_issue: true, clinical_suspension_decision: pending_human_review}
      ehs:
        event: "Clinics need a safe screening plan while authorities review the model incident."
        payload: {known_safety_signal: true, manual_review_capacity: to_be_assessed, service_suspension_decision: pending}
      mohap:
        event: "Coordinate the clinical incident review with the selected Dubai health and medical-products authorities."
        payload: {known_safety_signal: true, partner_authorities: [dha, ede], suspension_decision: pending_human_review}
      retina_swiss_ag:
        event: "Authorities are weighing a pause against interruption to screening; provide rollback and safety evidence."
        payload: {model: RetinaVision-DX, version: "2.4", rollback_available: unknown, human_approval_required: true}
      swissmedic:
        event: "Review device-vigilance evidence and coordinate with UAE counterparts."
        payload: {known_safety_signal: true, foreign_authority_review: requested, suspension_decision: pending}
      fodio:
        event: "Review unresolved processing issues while health authorities consider clinical safety action."
        payload: {known_data_use_issue: true, processing_roles: unresolved, clinical_suspension_decision: pending}
      uae_cyber:
        event: "Preserve cyber findings while health authorities consider their response."
        payload: {credential_theft_suspected: true, attribution: unconfirmed, health_decision: pending}
      ncsc:
        event: "Review reporting and evidence preservation alongside the device incident."
        payload: {credential_theft_suspected: true, reporting_applicability: unresolved, health_decision: pending}
      policy_adviser:
        event: "Compare evidence and unresolved policy questions; do not decide whether to suspend the system."
        payload: {known_safety_signal: true, known_data_use_issue: true, unresolved_questions: [suspension_authority, patient_follow_up, transfer_basis, reporting_deadlines]}
        expected_policy_checks: ["Identify evidence-backed coordination gaps and conclusions needing human legal review."]

  - step: 8
    time_offset: "Reserve: judge-injected"
    phase: "Optional escalation: patient images appear in an insurer pricing model"
    event: "A judge injects evidence that retinal images may have appeared in an insurer's pricing model."
    initiator: policy_adviser
    optional: true
    payload: {event_type: judge_injected_secondary_use}
    participants: [screening_ai, dha, ede, uae_data_office, retina_swiss_ag, swissmedic, fodio, policy_adviser]
    agent_views:
      screening_ai:
        event: "A judge alleges patient images may have been used for insurer pricing; the claim is unverified."
        payload: {claim: insurer_pricing_use, verification_status: unverified}
      dha:
        event: "A judge reports possible use of patient images in insurer pricing."
        payload: {claim: insurer_pricing_use, verification_status: unverified, requested_action: preserve_evidence}
      ede:
        event: "A judge reports possible secondary use of patient images in insurer pricing."
        payload: {claim: insurer_pricing_use, verification_status: unverified, device_incident_link: unverified}
      uae_data_office:
        event: "A judge reports possible insurer use of patient images; the claim is unverified."
        payload: {claim: insurer_pricing_use, verification_status: unverified, data_origin: AE}
      retina_swiss_ag:
        event: "A judge alleges patient images may have appeared in an insurer pricing model."
        payload: {claim: insurer_pricing_use, verification_status: unverified, request: preserve_processing_records}
      swissmedic:
        event: "A judge alleges possible secondary use of images associated with a device incident."
        payload: {claim: insurer_pricing_use, verification_status: unverified, device_safety_relevance: to_be_assessed}
      fodio:
        event: "A judge alleges possible insurer use of UAE-origin images processed in Switzerland."
        payload: {claim: insurer_pricing_use, verification_status: unverified, controller_roles: unresolved}
      policy_adviser:
        event: "A judge-injected allegation raises a new secondary-use question; distinguish allegation from established fact."
        payload: {claim: insurer_pricing_use, verification_status: unverified, required_next_step: evidence_collection}
