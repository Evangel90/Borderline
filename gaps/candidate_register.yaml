candidates:
  - id: CAND-003
    title: "No route for regulators to share AI medical-device incident reports outside a closed international exchange"
    category: "Coordination problem; standards gap"
    reason_from_drill: >-
      In the drill, a Swiss manufacturer's software update is linked to missed diagnoses in Dubai.
      The international exchange of regulators' incident reports (the International Medical Device
      Regulators Forum (IMDRF) National Competent Authority Report (NCAR) programme) is open only to
      the forum's management-committee regulators. Neither the Swiss nor the UAE regulator appears on
      its participant list, so the drill found no established regulator-to-regulator channel for the report.
    recommendation: >-
      Let regulators outside the forum's management committee join the incident-report exchange, or
      provide a model bilateral confidentiality arrangement they can use. This is a candidate standards
      contribution to an ITU Study Group.
    drill_steps:
      - {run: insufficient-20261108-3, steps: "5–6"}
    links:
      - {text: "International Medical Device Regulators Forum (IMDRF) National Competent Authority Report (NCAR) programme", chunk_id: "IMDRF-NCAR-N14-2025:p9:c1"}
      - {text: "open only to the forum's management-committee regulators", chunk_id: "IMDRF-NCAR-N14-2025:p9:c1"}
      - {text: "participant list", chunk_id: "IMDRF-NCAR-N14-2025:p16:c1"}
      - {text: "model bilateral confidentiality arrangement", chunk_id: "IMDRF-NCAR-N14-2025:p9:c2"}
    hypothesis: >-
      An international channel exists for medical-device regulators to exchange incident reports under
      confidentiality arrangements, but neither Swissmedic nor any UAE regulator participates. In the
      drill, a Swiss-made device harming UAE patients has no established regulator-to-regulator
      incident channel.
    quotes:
      - chunk_id: "IMDRF-NCAR-N14-2025:p9:c1"
        role: global_comparator
        quote: "Participation in the NCAR Exchange Program will be limited to the IMDRF Management Committee (MC) Regulators. A list of NCAR Participant Countries is provided in Annex1."
      - chunk_id: "IMDRF-NCAR-N14-2025:p9:c2"
        role: global_comparator
        quote: "IMDRF MC Regulators who intend to participate in the NCAR Exchange Program will need where possible to have confidentiality arrangements in place with other participating NCAs and the NCAR Secretariat."
      - chunk_id: "IMDRF-NCAR-N14-2025:p16:c1"
        role: context
        quote: "Annex 1– IMDRF NCAR Participant Countries"
      - chunk_id: "CH-EU-MRA-FACTSHEET-2025:p2:c2"
        role: partner
        quote: "However, without resolving the institutional issues, Switzerland remains excluded from market surveillance with EU member states for medical devices. This makes it more difficult for Swiss authorities to access the information they need to respond quickly to unsafe products."
        note: "Official Federal Council factsheet, 13 June 2025; does not name NCAR and does not prove the status after June 2025."
    searches:
      - search_id: SEARCH-NCAR-PARTICIPANTS-001
        absent_terms: ["Switzerland", "Swissmedic", "United Arab Emirates", "UAE"]
    could_be_refuted_by: [CH-EU-MRA-1999]
    refuting_evidence_to_look_for:
      - "A bilateral UAE-Swiss memorandum on device vigilance (not known to exist)."
      - "IMDRF membership or NCAR participant changes after March 2025."

  - id: CAND-002
    title: "No defined threshold for when an update to a diagnostic AI model needs re-approval"
    category: "Standards gap; technology gap"
    reason_from_drill: >-
      In the drill, a software update to the screening model is linked to missed diagnoses. The Dubai
      Health Authority (DHA) AI policy asks for certification of "major upgraded versions", but the
      sources held do not define "major" or name the certifying body. The institutions in the drill
      therefore could not tell from the text whether this update needed approval before release.
    recommendation: >-
      Define which model changes need prior approval and allow pre-approved change plans, as the EU
      Medical Device Regulation (MDR), its guidance MDCG 2020-3 and the US Food and Drug Administration
      (FDA) predetermined change control plans do.
    scope: "UAE side only; the Swiss side applies a general EU MDR prior-approval rule, so no Swiss gap is claimed."
    drill_steps:
      - {run: ungoverned-20261108-3, steps: "1–2"}
    links:
      - {text: "Dubai Health Authority (DHA) AI policy", chunk_id: "AE-DHA-AI-HEALTH-2021:p10:c1"}
      - {text: "\"major upgraded versions\"", chunk_id: "AE-DHA-AI-HEALTH-2021:p10:c1"}
      - {text: "EU Medical Device Regulation (MDR)", chunk_id: "EU-MDR-2017-745:p202:c1"}
      - {text: "MDCG 2020-3", chunk_id: "EU-MDCG-2020-3-REV1:p13:c2"}
      - {text: "predetermined change control plans", chunk_id: "US-FDA-PCCP-AI-2025:p7:c2"}
    hypothesis: >-
      The registered UAE sources require certification of "major upgraded versions" of AI software
      without defining "major" or naming the certifying body, while Switzerland (through the EU MDR
      annexes it applies) requires prior approval of changes that could affect safety or performance.
    quotes:
      - chunk_id: "AE-DHA-AI-HEALTH-2021:p10:c1"
        role: host
        quote: "Comply with all required certification of the AI software and its major upgraded versions from recognized international/local agencies."
      - chunk_id: "CH-HEALTH-MedDO:p13:c1"
        role: partner
        quote: "The conformity assessment procedure is governed by Articles 52 and 54 and by Annexes IX–XI to EU-MDR"
      - chunk_id: "EU-MDR-2017-745:p202:c1"
        role: global_comparator
        quote: "Changes to the approved device shall require approval from the notified body which issued the EU technical documentation assessment certificate where such changes could affect the safety and performance of the device or the conditions prescribed for use of the device."
      - chunk_id: "EU-MDCG-2020-3-REV1:p13:c2"
        role: global_comparator
        quote: "change of an algorithm which impact the operating principles or impact the control of the device and may alter the diagnosis or therapy delivered"
      - chunk_id: "IMDRF-AIML-N88-2025:p8:c2"
        role: global_comparator
        quote: "when models are retrained after deployment, there are appropriate controls in place to manage risks of overfitting, unintended bias, or degradation of the model (for example, dataset drift) that may impact the safety and performance of the model."
      - chunk_id: "US-FDA-PCCP-AI-2025:p7:c2"
        role: global_comparator
        quote: "1) a detailed description of the specific, planned device modifications, which is referred to as the “Description of Modifications”; 2) the associated methodology to develop, validate, and implement those modifications in a manner that ensures the continued safety and effectiveness of the device across the intended use populations, which is referred to as the “Modification Protocol”; and 3) the assessment of the benefits and risks of the planned modifications and risk mitigations, which is referred to as the “Impact Assessment.”"
    searches:
      - search_id: SEARCH-AI-CHANGE-CONTROL-001
        absent_terms: ["predetermined change control", "change control plan", "modification protocol"]
      - search_id: SEARCH-AI-CHANGE-CONTROL-002
        absent_terms: []
    could_be_refuted_by: [AE-FEDERAL-DECREE-LAW-38-2024-AR-CLEAN]
    refuting_evidence_to_look_for:
      - "EDE implementing rules for software changes under Federal Decree-Law No. 38 of 2024 (not known to exist)."
      - "Any UAE AI-device guidance outside this knowledge base."

  - id: CAND-001
    title: "No designated authority for cross-border enforcement cooperation on patient data used by diagnostic AI"
    category: "Unclear responsibilities; coordination problem"
    reason_from_drill: >-
      In the drill, UAE patients' retinal images are held and processed in Zurich. The Swiss
      data-protection regulator (the Federal Data Protection and Information Commissioner, FDPIC) may
      exchange information only with a foreign data-protection authority that offers reciprocity. UAE
      law governs health data through its own health legislation rather than the general
      data-protection law, and the sources in this knowledge base do not name which UAE body would act
      as the FDPIC's counterpart for health data held abroad.
    recommendation: >-
      Designate a national contact point for cross-border cooperation on health-data protection, as the
      Organisation for Economic Co-operation and Development (OECD) 2007 Recommendation on privacy
      enforcement asks its adherents to do.
    drill_steps:
      - {run: ungoverned-20261108-3, steps: "7–8"}
      - {run: insufficient-20261108-3, steps: "2–4"}
    links:
      - {text: "Federal Data Protection and Information Commissioner, FDPIC", chunk_id: "CH-DATA-FADP:p24:c1"}
      - {text: "offers reciprocity", chunk_id: "CH-DATA-FADP:p24:c1"}
      - {text: "its own health legislation", chunk_id: "AE-HEALTH-ICT-LAW-2019:p8:c1"}
      - {text: "general data-protection law", chunk_id: "AE-DATA-PDPL-2021-EN:p6:c2"}
      - {text: "2007 Recommendation on privacy enforcement", chunk_id: "OECD-LEGAL-0352:p9:c1"}
    hypothesis: >-
      When UAE patients' health data is held and reused abroad, the registered sources do not show an
      instrument connecting a competent UAE authority to the Swiss FDPIC with the reciprocity FADP
      Art. 55 requires.
    quotes:
      - chunk_id: "AE-DATA-PDPL-2021-EN:p6:c2"
        role: host
        quote: "Provisions of this Decree by Law shall not apply to the following:"
      - chunk_id: "AE-DATA-PDPL-2021-EN:p6:c2"
        role: host
        quote: "e. Personal Health Data that has legislation regulating its protection and processing."
      - chunk_id: "AE-HEALTH-ICT-LAW-2019:p8:c1"
        role: host
        quote: "It is not permissible to store, process, generate or transform the health data and information outside State -which are related to the health services provided inside State- except in the case where a resolution is issued from the Health Authority in coordination with the Ministry."
      - chunk_id: "AE-DHA-HEALTH-DATA-PROTECTION-PP11-2022:p27:c1"
        role: host
        quote: "Protected health information should not be transferred to a country or territory outside the UAE; except for transfer of PHI within the category of UAE ICT Health Law exemptions"
      - chunk_id: "AE-DHA-HEALTH-DATA-PROTECTION-PP11-2022:p35:c1"
        role: host
        quote: "must inform the UAE Information Office and DHA the contact details of the appointed DPO."
      - chunk_id: "AE-DHA-HEALTH-INFO-SHARING-PP13-2024:p30:c2"
        role: host
        quote: "Protected health information should not be transferred to a country or territory outside the UAE; except for transfer of PHI within the category of Cabinet Decision No. (51) of year 2021"
      - chunk_id: "AE-DHA-HEALTH-INFO-SHARING-PP13-2024:p18:c2"
        role: host
        quote: "For the purposes of scientific and clinical research, provided that the ethics and rules of scientific research are followed as per ICH_GCP principles and guidelines. Non-identifiable If Identifiable data needed, then Patient consent required"
      - chunk_id: "AE-DATA-OFFICE-LAW-44-2021:p2:c2"
        role: host
        quote: "Propose joining or signing the international conventions and agreements and propose the partnership agreements with the gulf, regional and international states, organisations, and bodies with regards to the activities and competencies of the Office"
      - chunk_id: "CH-DATA-FADP:p24:c1"
        role: partner
        quote: "The FDPIC may exchange information or personal data with foreign authorities that are responsible for data protection in order that they may fulfil their respective statutory duties in relation to data protection, provided the following requirements are satisfied: a. Reciprocity with regard to administrative assistance is guaranteed."
      - chunk_id: "OECD-LEGAL-0352:p9:c1"
        role: global_comparator
        quote: "Member countries should designate a national contact point for co-operation and mutual assistance under this Recommendation"
      - chunk_id: "OECD-LEGAL-0352-ADHERENTS-2026:p8:c1"
        role: context
        quote: "Spain Sweden Switzerland Türkiye United Kingdom United States Non-Members None"
        note: "Browser print of the OECD instrument page, 7 November 2026: Switzerland adheres; there are no non-member adherents, so the UAE did not."
    searches:
      - search_id: SEARCH-HEALTH-DATA-AUTHORITY-001
        absent_terms: ["foreign authorit", "reciproc"]
    could_be_refuted_by: [OECD-LEGAL-0352-ADHERENTS, AE-HEALTH-DATA-EXEMPTIONS-MR51-2021]
    refuting_evidence_to_look_for:
      - "Any Emirates Data Office cooperation agreement with the FDPIC (not known to exist)."
      - "PDPL Executive Regulations (reportedly not issued as of mid-2026; not verified)."

  - id: CAND-004
    title: "The rules on when health data may leave the country are hard to locate and inconsistently cited"
    category: "Legislative gap (transparency)"
    reason_from_drill: >-
      In the drill, the deciding question is whether UAE patients' retinal images may be kept in Zurich.
      The answer depends on Ministerial Resolution No. 51 of 2021, which is not publicly accessible to
      the project after documented attempts: the hosting portal could not be reached from outside the
      region, two health-authority policies cite it under a different instrument type ("Cabinet
      Decision"), and one linked copy is a gazette issue containing a different law. This describes the
      project's access, not whether the resolution has been published.
    recommendation: >-
      Publish the exceptions at a stable address with one consistent citation, as the EU does when it
      keeps notified national derogations publicly available (an analogy only).
    drill_steps:
      - {run: insufficient-20261108-3, steps: "1"}
      - {run: ungoverned-20261108-3, steps: "6"}
    links:
      - {text: "two health-authority policies cite it under a different instrument type", chunk_id: "AE-DHA-HEALTH-DATA-PROTECTION-PP11-2022:p27:c1"}
      - {text: "one linked copy", chunk_id: "AE-DHA-HEALTH-DATA-PROTECTION-PP11-2022:p27:c1"}
      - {text: "keeps notified national derogations publicly available", chunk_id: "EU-MDR-2017-745:p30:c1"}
    hypothesis: >-
      The binding list of cases in which UAE health data may leave the State is not publicly accessible
      to the project after documented attempts: the regulator's site was unreachable, and DHA's own
      policies call it a "Cabinet Decision" (it is ministerial), with PP-11 linking a gazette issue that
      contains a different law. This is worded as inaccessibility to the project, not as the document
      being absent from public record.
    quotes:
      - chunk_id: "AE-HEALTH-ICT-LAW-2019:p8:c1"
        role: host
        quote: "except in the case where a resolution is issued from the Health Authority in coordination with the Ministry."
      - chunk_id: "AE-DHA-HEALTH-DATA-PROTECTION-PP11-2022:p27:c1"
        role: host
        quote: "a. Cabinet Decision No. (51) of year 2021 on exemption for storage and transfer of health records and information must be abide to: https://www.dha.gov.ae/uploads/112021/fd2757c0-7f87-4f1d-b6c34c8eb9045393.pdf"
      - chunk_id: "AE-DHA-HEALTH-INFO-SHARING-PP13-2024:p30:c2"
        role: host
        quote: "within the category of Cabinet Decision No. (51) of year 2021 on exemption for storage and transfer of health records and information"
      - chunk_id: "EU-MDR-2017-745:p30:c1"
        role: global_comparator
        quote: "of the national provisions introduced pursuant to this paragraph and the grounds for introducing them. The Commission shall keep the information publicly available."
        note: "Analogy only: EU national derogations (reprocessing of single-use devices) are notified and kept publicly available."
    searches:
      - search_id: SEARCH-RESOLUTION-51-REFERENCES-001
        absent_terms: ["Ministerial Resolution No. (51)", "Ministerial Resolution No. 51"]
    accessibility_of: AE-HEALTH-DATA-EXEMPTIONS-MR51-2021
    could_be_refuted_by: []
    refuting_evidence_to_look_for:
      - "A public, official copy of Resolution No. 51 of 2021 (the Arabic PP-11, registered but excluded from retrieval, was not searched)."
