  - id: CH-EU-MRA-1999
    title: "Agreement between the European Community and the Swiss Confederation on mutual recognition in relation to conformity assessment (1999), medical devices chapter, as currently in force"
    kind: question_answered_by_registered_source
    where: "EUR-Lex (Official Journal L 114, 30.4.2002) and later Joint Committee decisions"
    note: "Could show whether Swissmedic reaches NCAR reports through the European Commission."
    attempts:
      - date: "2026-11-07"
        attempt: "Download the agreement text from Fedlex and EUR-Lex"
        outcome: "Downloads failed for the user; the agreement text itself was not fetched."
    answered_by:
      - chunk_id: "CH-EU-MRA-FACTSHEET-2025:p1:c2"
        quote: "However, the EU has refused to update the agreement since May 2021 due to unresolved institutional issues. This decision is currently affecting medical devices."
      - chunk_id: "CH-EU-MRA-FACTSHEET-2025:p1:c3"
        quote: "Switzerland and the EU have set out the arrangements for their cooperation from the end of 2024 until the package comes into force."
      - chunk_id: "CH-EU-MRA-FACTSHEET-2025:p2:c2"
        quote: "However, without resolving the institutional issues, Switzerland remains excluded from market surveillance with EU member states for medical devices."
    limits: >-
      The status question (is the medical-devices chapter in effect for Swiss participation in EU device
      cooperation?) is answered by an official Federal Council factsheet dated 13 June 2025. It is not the
      agreement text, it does not mention the IMDRF NCAR programme by name, and it does not prove the
