# Gap candidates as data, checked by gaps/sufficiency.py (`make assess-candidates`).
#
# Nothing here is a legal conclusion. No one with legal standing has reviewed it.
# A candidate is SUPPORTED_CANDIDATE only when code confirms all of:
#   1. every quote verifies word for word against its chunk;
#   2. every listed search record exists in gaps/searches/ and its absent terms were not found;
#   3. at least one verified quote from a GLOBAL source is marked as a comparator;
#   4. no known-missing document that is still obtainable could refute it.
# Otherwise it stays OPEN_CANDIDATE, and the output lists each unmet condition.
#
# Quote roles: host (UAE side), partner (Swiss side), global_comparator, context.

# Documents we know exist but do not hold. Two kinds:
#   unobtainable_after_documented_attempts: does not block; needs at least one documented attempt
#     (without one it is treated as obtainable). Recorded as its own accessibility candidate.
#   obtainable_not_fetched: blocks every candidate it could refute until it is fetched.
#   question_answered_by_registered_source: the document was not fetched, but the question it could
#     settle is answered by `answered_by` quotes from a registered source; does not block, but only if
#     every answering quote verifies (otherwise it is treated as obtainable). `limits` says what the
#     answering source does not prove.
# Documents not known to exist (e.g. "any bilateral memorandum") are not listed here; they go
# under a candidate's refuting_evidence_to_look_for and do not block.
