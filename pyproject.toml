[project]
name = "borderline"
version = "0.0.1"
description = "LLM-driven multi-agent engine for cross-border AI incident drills"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "pymupdf>=1.24",
    "chromadb>=0.5.0",
    "fastembed>=0.7.0",
]

[project.optional-dependencies]
# Runs vendor/ITUAIReadiness ingestion (M0 check, ITU-format export)
itu = [
    "ollama>=0.4.0",
    "pydantic-settings>=2.0.0",
]
ui = [
    "streamlit>=1.40",
]

[tool.setuptools]
packages = ["engine", "audit", "gaps"]
