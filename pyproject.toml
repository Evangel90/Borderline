[project]
name = "borderline"
version = "0.0.1"
description = "Bounded AI agents for cross-border AI incident drills"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "pymupdf>=1.24",
    "chromadb>=0.5.0",
    "fastembed>=0.7.0",
]

[project.optional-dependencies]
# Runs the ITU reference ingestion (`make knowledge-base`, `make itu-smoke`; vendor/ is not in the repository)
itu = [
    "ollama>=0.4.0",
    "pydantic-settings>=2.0.0",
]

[tool.setuptools]
packages = ["engine", "audit", "gaps"]
