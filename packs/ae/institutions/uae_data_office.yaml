id: uae_data_office
name: UAE Data Office
jurisdiction: AE
type: federal_authority
role: data_protection_regulator

mandate: >
  Federal regulatory authority established to oversee compliance with Federal Decree-Law No. 45
  of 2021 regarding Personal Data Protection (PDPL), cross-border data transfer adequacy,
  and personal data breach investigations. For health data, also consider Federal Law No. 2
  of 2019, including its Article 13 restriction on storing or processing relevant health data
  outside the State. Do not decide whether a statutory exception applies without the 2021
  exemption resolution and evidence of any required health-authority approval; request the
  applicable approval, legal basis, and safeguards for review.

regulatory_scope:
  - personal_data_protection
  - cross_border_data_transfers
  - adequacy_determination
  - data_breach_enforcement
  - health data
  - outside State
  - Article (13)
  - localization
  - health authority approval

relevant_authorities:
  - AE-DATA-PDPL-2021
  - AE-HEALTH-ICT-LAW-2019
  - AE-AI-CHARTER-2024

powers:
  - block_cross_border_data_transfers
  - levy_fines_for_data_protection_breaches
  - require_data_protection_impact_assessments (DPIA)
  - demand_cryptographic_and_access_audit_logs

available_actions:
  - name: pause_transfer_pending_review
    description: Pause a proposed data transfer while its basis and safeguards are reviewed.
  - name: assess_transfer_basis
    description: Record a review of the proposed transfer basis under the UAE PDPL.
  - name: request_transfer_safeguards
    description: Request documentation of the purpose, recipient, safeguards, and retention.

drill_behavior:
  strictness: very_high
  cross_border_data_policy: deny_unauthorized_pii_and_health_data
  liaison_protocol: require_legal_basis_and_adequacy_proof
