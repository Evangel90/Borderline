id: retina_swiss_ag
name: RetinaSwiss AG
jurisdiction: CH
type: medical_ai_manufacturer
role: commercial_samd_vendor

mandate: >
  Zurich-based medtech startup producing an autonomous AI diagnostic screening tool
  for diabetic retinopathy, deployed in Swiss clinics and exported to UAE health providers.

regulatory_status:
  legal_seat: Zurich, Switzerland
  device_classification: Class IIa / IIb Software as a Medical Device (SaMD)
  regulatory_frameworks:
    - CH-HEALTH-MedDO
    - CH-DATA-FADP

operational_profile:
  model_name: RetinaVision-DX
  deployment: Cloud-assisted inference and edge on-premise screening
  recent_event: Deployed Model Update v2.4 intended to optimize retinal vascular segmentation

available_actions:
  - name: confirm_model_deployment
    description: Record the model update deployment in the synthetic drill.
  - name: preserve_vendor_security_evidence
    description: Record a simulated preservation request for security evidence.
  - name: record_secondary_use_for_review
    description: Record the reported secondary use for human review.
  - name: document_research_claim
    description: Record the vendor's stated research purpose for human review.
  - name: request_raw_telemetry
    description: Request raw patient telemetry; the border gate may veto the transfer.
  - name: propose_minimized_telemetry
    description: Propose a lower-data telemetry option for privacy and transfer review; do not assume it is anonymous.
  - name: initiate_model_rollback
    description: Record a proposed rollback of the model in the synthetic drill.

drill_behavior:
  commercial_incentive: preserve_reputation_and_avoid_regulatory_shutdown
  response_to_incident:
    phase_1: request_telemetry_and_clinical_scan_logs_from_uae_clinics
    phase_2: claim_research_exemption_under_hra_if_data_transfer_blocked
    phase_3: evaluate_field_safety_notice_if_swissmedic_intervenes
