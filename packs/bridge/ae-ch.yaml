id: ae-ch
title: UAE - Switzerland Bilateral AI & Health Data Regulatory Bridge
version: "1.0.0"

parties:
  host_state:
    code: AE
    regulators:
      health: mohap
      data: uae_data_office
      provider: ehs
  partner_state:
    code: CH
    regulators:
      health: swissmedic
      data: fodio
      manufacturer: retina_swiss_ag

adequacy_status:
  ch_recognizes_ae: false
  basis_ch: "DPO (SR 235.11) Annex 1 (checked-in 2023 text): UAE is not listed; this adequacy list concerns disclosures from Switzerland."
  ae_recognizes_ch: conditional
  basis_ae: "UAE PDPL (Federal Decree-Law 45/2021) Arts. 22–23: transfers may proceed through the applicable adequacy, approval, safeguard, or statutory-exception route."

cross_border_regimes:
  health_data:
    ae_rule: "UAE PDPL (Federal Decree-Law 45/2021) Arts. 22–23 condition transfers of personal data outside the State on adequacy, Office approval, or specified safeguards and exceptions."
    ch_rule: "Swiss FADP Arts. 16–17 and DPO Arts. 8–9 / Annex 1 set conditions for disclosures abroad by Swiss controllers; assess role and direction because these provisions do not by themselves decide a UAE-to-Switzerland export."
  medical_device_vigilance:
    ch_rule: "MedDO (SR 812.213) Art. 66 covers manufacturer reports for serious incidents in Switzerland; where an authorized representative is required, trend reports include incidents in Switzerland and abroad. Assess applicability to the UAE event."
    ae_rule: "MoHAP AI Guidelines require adverse incident notification to UAE health authorities."

liaison_gate_rules:
  raw_patient_telemetry:
    action: BLOCK
    reason: "Blocked in this scenario pending evidence of an applicable UAE PDPL transfer basis and required Swiss safeguards; this is not a blanket prohibition on every transfer."
  anonymized_error_metadata:
    action: ROUTE
    reason: "Requires a documented legal basis, data-minimization review, and privacy/security assessment before any transfer; reduced-data telemetry is not presumed anonymous or safe."
    conditions:
      - "Document the applicable transfer basis and required authorization"
      - "Minimize fields and assess re-identification and model-inversion risk"
      - "Record purpose, recipient, safeguards, retention, and access controls"
  mutual_regulatory_notification:
    action: ROUTE
    path: "MoHAP <-> Swissmedic bilateral vigilance channel"
