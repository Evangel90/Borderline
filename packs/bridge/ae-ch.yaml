id: ae-ch
title: UAE - Switzerland Bilateral AI & Health Data Regulatory Bridge
version: "1.0.0"

parties:
  host_state:
    code: AE
    regulators:
      health: mohap
      data: uae_data_office
      provider: dubai_clinic_operator
  partner_state:
    code: CH
    regulators:
      health: swissmedic
      data: fodio
      manufacturer: retina_swiss_ag

adequacy_status:
  ch_recognizes_ae: false
  basis_ch: "DPO (SR 235.11) Annex 1 (checked-in 2023 text): UAE is not listed; this adequacy list concerns disclosures from Switzerland."
  ae_recognizes_ch: conditional
  basis_ae: "UAE PDPL (Federal Decree-Law 45/2021) Arts. 22–23: transfers may proceed through the applicable adequacy, approval, safeguard, or statutory-exception route."

cross_border_regimes:
  health_data:
    ae_rule: "UAE PDPL (Federal Decree-Law 45/2021) Arts. 22–23 condition transfers of personal data outside the State on adequacy, Office approval, or specified safeguards and exceptions."
    ch_rule: "Swiss FADP Arts. 16–17 and DPO Arts. 8–9 / Annex 1 set conditions for disclosures abroad by Swiss controllers; assess role and direction because these provisions do not by themselves decide a UAE-to-Switzerland export."
  medical_device_vigilance:
    ch_rule: "MedDO (SR 812.213) Art. 66 covers manufacturer reports for serious incidents in Switzerland; where an authorized representative is required, trend reports include incidents in Switzerland and abroad. Assess applicability to the UAE event."
    ae_rule: "MoHAP AI Guidelines require adverse incident notification to UAE health authorities."

liaison_gate_rules:
  raw_patient_telemetry:
    action: BLOCK
    reason: "Blocked in this scenario pending evidence of an applicable UAE PDPL transfer basis and required Swiss safeguards; this is not a blanket prohibition on every transfer."
  anonymized_error_metadata:
    action: ROUTE
    reason: "Requires a documented legal basis, data-minimization review, and privacy/security assessment before any transfer; reduced-data telemetry is not presumed anonymous or safe."
    conditions:
      - "Document the applicable transfer basis and required authorization"
      - "Minimize fields and assess re-identification and model-inversion risk"
      - "Record purpose, recipient, safeguards, retention, and access controls"
  mutual_regulatory_notification:
    action: ROUTE
    path: "MoHAP <-> Swissmedic bilateral vigilance channel"

# Hand-written reference answers for the three liaison-channel questions (engine/liaison.py).
# They do not decide anything: an AI liaison reviewer answers each question with quotes that
# code verifies. These answers are logged next to the reviewer's as `reference_answer` so
# disagreements can be reviewed, and they serve as a test fixture.
liaison:
  counterparts:
    - [mohap, swissmedic]
    - [uae_data_office, fodio]
    - [ede, swissmedic]
  request_types:
    cross_border_evidence_request:
      answer: UNCLEAR
      reason: "Swiss TPA Art. 64 lets Swiss enforcement authorities disclose non-public information to foreign authorities that enforce therapeutic-product regulations, if the requester is bound by official secrecy, uses it only in that enforcement and passes nothing on; health data needs further conditions such as averting a serious health risk. No UAE assurance meeting these conditions, and no UAE-Switzerland cooperation instrument, is registered in this bridge pack."
      sources: [CH-HEALTH-TPA]
    data_protection_assistance_request:
      answer: UNCLEAR
      reason: "Swiss FADP Art. 55(1) lets the FDPIC exchange information with foreign authorities 'responsible for data protection' so they may fulfil 'their respective statutory duties in relation to data protection', if reciprocity is guaranteed and the recipient keeps secrecy and uses the information only in that proceeding. UAE PDPL Art. 2(2)(e) excludes 'Personal Health Data that has legislation regulating its protection and processing', so whether the UAE Data Office has a statutory data-protection duty over UAE patients' retinal images is unclear. No reciprocity assurance is registered in this bridge pack."
      sources: [CH-DATA-FADP, AE-DATA-PDPL-2021-EN]
    incident_notification:
      answer: UNCLEAR
      reason: "No UAE-Switzerland vigilance or incident-notification exchange instrument is registered in this bridge pack."
  personal_data_transfers:
    AE->CH:
      answer: UNCLEAR
      reason: "UAE Federal Law No. 2 of 2019 Art. 13 does not permit storing or processing health data outside the State unless the Health Authority issues a resolution in coordination with the Ministry. No such resolution or exemption is in this knowledge base."
      sources: [AE-HEALTH-ICT-LAW-2019]
    CH->AE:
      answer: UNCLEAR
      reason: "The UAE is not on the checked Swiss DPO Annex 1 adequacy list, so a disclosure from Switzerland would need FADP Art. 16(2) safeguards or an Art. 17 exception. None is recorded."
      sources: [CH-DATA-FADP, CH-DATA-DPO]
